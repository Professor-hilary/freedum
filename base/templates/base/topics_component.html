<h3>Browse Topics</h3>
<div class="my-2" style="width: 100%; height: 1px; background-color: rgba(0, 0, 0, .1);"></div>

<div class="d-flex container py-1 pl-0">
    <a href="{% url "home" %}">All Topics (<span>{{topics.count}}</span> Topics)</a>
</div>

{% for topic in topics %}
    <div class="d-flex container py-1 pl-0">
        <a href="{% url "home" %}?q={{topic.name}}">{{topic.name}} (<span>{{topic.room_set.all.count}}</span>)</a>
    </div>
{% endfor %}

<a href="{% url "topics" %}" class="btn btn--link pl-0" style="text-align: left;">
    More <i class="fa fa-chevron-circle-down" aria-hidden="true"></i>
</a>
