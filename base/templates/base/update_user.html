{% extends "main.html" %} {% block content %}

<style></style>

<div class="container mt-5">
    <h4>Edit Profile Information</h4>

    <form action="" method="POST">
        {% csrf_token %}
        <div class="d-flex flex-column" style="width: 50%">
            <div class="input-group mb-3" style="">
                <label
                    class="input-group-text"
                    for="filePicker"
                    style="
                        width: 20%;
                        border-top-right-radius: 0;
                        border-bottom-right-radius: 0;
                        background-color: var(--card-color);
                        border-color: var(--card-border-color);
                        color: var(--text-color);
                    "
                    >Avatar</label
                >
                <input
                    type="file"
                    class="form-control"
                    id="filePicker"
                    style="
                        background-color: transparent;
                        border-color: var(--card-border-color);
                        color: var(--text-color);
                    "
                />
            </div>

            {% comment %} <div class="input-group flex-nowrap mb-3" style="">
                <label
                    class="input-group-text"
                    style="
                        width: 20%;
                        border-top-right-radius: 0;
                        border-bottom-right-radius: 0;
                        background-color: var(--card-color);
                        border-color: var(--card-border-color);
                        color: var(--text-color);
                    "
                    id="addon-wrapping"
                    for="username"
                    >Username</label
                >
                <input
                    type="text"
                    class="form-control"
                    placeholder="Username"
                    aria-label="Username"
                    id="username"
                    aria-describedby="addon-wrapping"
                    style="
                        background-color: transparent;
                        border-color: var(--card-border-color);
                        color: var(--text-color);
                    "
                />
            </div>

            <div class="input-group flex-nowrap mb-3" style="">
                <label
                    class="input-group-text"
                    style="
                        width: 20%;
                        border-top-right-radius: 0;
                        border-bottom-right-radius: 0;
                        background-color: var(--card-color);
                        border-color: var(--card-border-color);
                        color: var(--text-color);
                    "
                    id="addon-wrapping"
                    for="email"
                    >Email</label
                >
                <input
                    type="email"
                    class="form-control"
                    placeholder="Email"
                    id="email"
                    aria-label="Email"
                    aria-describedby="addon-wrapping"
                    style="
                        background-color: transparent;
                        border-color: var(--card-border-color);
                        color: var(--text-color);
                    "
                />
            </div>

            <div class="input-group mb-3" style="">
                <label
                    class="input-group-text"
                    style="
                        width: 20%;
                        border-top-right-radius: 0;
                        border-bottom-right-radius: 0;
                        background-color: var(--card-color);
                        border-color: var(--card-border-color);
                        color: var(--text-color);
                    "
                    for="bio"
                    >Bio</label
                >
                <textarea
                    class="form-control"
                    style="
                        resize: none;
                        background-color: transparent;
                        border-color: var(--card-border-color);
                        color: var(--text-color);
                    "
                    id="bio"
                    rows="4"
                    aria-label="With textarea"
                ></textarea>
            </div> {% endcomment %}

            <div class="d-flex gap-2 form__group">
                <button class="btn btn-primary my-3 px-4 mr-4" type="submit">
                    Save Changes
                </button>
                <a href="{{request.META.HTTP_REFERER}}" class="text-white">
                    <button class="btn btn-secondary my-3 px-4" type="button">
                        Go Back
                    </button>
                </a>
            </div>
        </div>
    </form>
</div>

{% endblock content %}
