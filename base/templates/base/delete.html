{% extends "main.html" %}

{% block content %}

<form action="" method="post" class='container my-4'>
    {% csrf_token %}
    <p>Do you really want to delete "{{obj}}"?</p>
    
    <a href="{{request.META.HTTP_REFERER}}"><button class="btn btn-secondary" type="button">Go Back</button></a>
    <button class="btn btn-danger" type="submit" onclick="confirm('Are you sure?')">Confirm</button>
</form>

{% endblock content %}
