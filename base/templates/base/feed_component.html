{% for room in rooms%}
{% load static %}
<style>
    .feed-item {
        background: var(--card-color); /* Light background for contrast */
        border: 1px solid var(--card-border-color); /* Subtle border like SO */
        border-radius: 5px;
        margin-bottom: 15px;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.05);
    }

    .feed-item-body {
        padding: 15px;
    }

    .feed-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
        margin-bottom: 8px;
        color: #6a737d; /* SO uses a gray tone for metadata */
    }

    .author {
        font-weight: bold;
        color: #0074cc; /* SO-like blue for user links */
        text-decoration: none;
    }

    .date {
        font-size: 12px;
        color: #888;
    }

    .feed-actions {
        margin-bottom: 8px;
    }

    .edit {
        color: #0074cc;
        margin-right: 10px;
    }

    .delete {
        color: #d9534f;
        font-weight: bold;
    }

    .feed-title {
        font-size: 18px;
        margin: 5px 0;
    }

    .room-link {
        color: #0074cc;
        text-decoration: none;
        font-weight: bold;
    }

    .room-link:hover {
        text-decoration: underline;
    }

    .topic {
        font-size: 14px;
        color: #6a737d;
    }

    .description {
        font-size: 0.8em;
        color: var(--feed-description);
    }
</style>

<div class="feed-item">
    <div class="feed-header card-header m-0">
        <div  class="d-flex" style="gap: 10px;align-items: end;">
            <div
                class="border boder-1"
                style="
                    border-radius: 50%;
                    overflow: hidden;
                    object-fit: contain;
                    height: fit-content;
                    border-color: var(--card-border-color) !important;
                "
            >
                <img
                    src="{{room.host.avatar.url}}"
                    alt=""
                    style="width: 35px !important; height: 35px !important"
                    srcset=""
                    class=""
                />
            </div>
            <div class="d-flex flex-column">
                <a href="{% url 'user-profile' room.host.id %}" class="author">@{{ room.host.username }}</a>
                <p class="m-0 p-0" style="font-size: .8em; font-style: italic;">{{ room.created|timesince}}</p>
            </div>
        </div>
        {% if request.user == room.host %}
        {% endif %}
    </div>

    <div class="feed-item-body">
        <h5 class="feed-title">
            {% comment %} {{ room.id }} -- {% endcomment %}
            <a href="{% url 'room' room.id %}" class="room-link" style="overflow-wrap: anywhere;"
                >{{ room.name }}</a
            >
        </h5>
        <p class="description"  style="overflow-wrap: anywhere;">{{room.description}}</p>
        <small class="topic">{{ room.topic.name }}</small>
    </div>
</div>
{% endfor %}
