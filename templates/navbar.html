{% load static %}

<style>
    .container-fluid {
        padding-left: 0px;
        padding-right: 0px;
    }

    li {
        list-style-type: none;
    }

    .parent {
        position: sticky;
        z-index: 1000;
        top: 0px;
        background-color: var(--nav-bar);
    }
</style>

<div class="parent" style="position: sticky">
    <nav class="bg-body-tertiary container">
        <div
            class="container-fluid d-flex my-0"
            style="justify-content: space-between; align-items: center"
        >
            <a class="my-2" href="/"
                ><img
                    src="{% static 'img/freedumsvg.svg' %}"
                    style="height: 40px"
                    alt="logo"
                    srcset=""
            /></a>
            {% comment %}
            <div class="d-flex" id="navbarText">
                <ul class="d-flex m-0">
                    <li class="nav-item" style="height: fit-content">
                        <a class="nav-link active" aria-current="page" href="/">
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">
                            QA
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Tuitorial</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                </ul>
            </div>
            {% endcomment %}
            <form
                action="{% url 'home' %}"
                method="get"
                class="d-flex m-0"
                role="search"
                style="width: 60%"
            >
                <div
                    class="input-group"
                    style="
                        border: solid 1px var(--search-border);
                        border-radius: 5px;
                    "
                >
                    <input
                        class="form-control my-0"
                        type="search"
                        name="q"
                        placeholder="Looking for something...?"
                        aria-label="Search"
                        style="
                            background-color: var(--search-color);
                            border-width: 0px;
                        "
                        aria-describedby="button-addon2"
                    />
                    <button
                        class="btn btn-outline-secondary"
                        type="submit"
                        id="button-addon2"
                        style="
                            border-radius: 0px;
                            border: 0px;
                            border-left: 1px solid;
                        "
                    >
                        Search
                    </button>
                </div>
            </form>
            <label class="toggle-container mb-0">
                <span id="toggle-label">Dark Mode</span>
                <div class="toggle-switch">
                    <div class="toggle-circle"></div>
                </div>
            </label>
            <div class="p-3 d-flex" style="justify-content: center; align-items: center; ">
                <span class="mb-0" style="font-weight: bold;">Setting</span>
                <a href="{% url "update-user" %}" class="" >
                    <i
                        class="fa fa-cog pl-2"
                        style="font-size: 20px"
                        aria-hidden="true"
                    ></i
                ></a>
            </div>
        </div>
    </nav>

    <hr class="m-0 bg-warning" style="" />
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const toggleSwitch = document.querySelector(".toggle-switch");
        const body = document.body;
        const toggleLabel = document.getElementById("toggle-label");

        // Check saved theme and apply
        if (localStorage.getItem("theme") === "dark") {
            body.classList.add("dark-mode");
            toggleLabel.textContent = "Light Mode";
        }

        toggleSwitch.addEventListener("click", () => {
            if (body.classList.contains("dark-mode")) {
                body.classList.remove("dark-mode");
                localStorage.setItem("theme", "light");
                toggleLabel.textContent = "Dark Mode";
            } else {
                body.classList.add("dark-mode");
                localStorage.setItem("theme", "dark");
                toggleLabel.textContent = "Light Mode";
            }
        });
    });
</script>
