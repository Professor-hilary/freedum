<style>
  .container-fluid {
    padding-left: 0px;
    padding-right: 0px;
  }
  
  li {
    list-style-type: none;
  }

  .parent{
    position: sticky;
    top: 0px;
    background-color: #f9f9f9;
  }
</style>

<div class="parent" style="position: sticky;">
  {% comment %} <div class="container d-flex" style='width: 100%;justify-content: center;'>
    <a class="my-2" href="/"><h1>LOGO</h1></a>
  </div>  {% endcomment %}

  <nav class="bg-body-tertiary container">
    <div class="container-fluid d-flex my-0" style="justify-content: space-between; align-items: center;">
      <a class="my-2" href="/"><h1>LOGO</h1></a>
      <div class="d-flex" id="navbarText">
        <ul class="d-flex m-0">
          <li class="nav-item" style="height: fit-content;">
            <a class="nav-link active" aria-current="page" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Featured</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Projects</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">QA</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Tuitorial</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">About</a>
          </li>
          <li class="nav-item" style="display: flex;">
            <div class="container" style="display: flex; align-items: center;">
              {% if request.user.is_authenticated %}
                <a href="{% url 'logout' %}" class="text-danger">(Logout)</a>
              {% else %}
                <a href="{% url 'login' %}">(Login)</a>
              {% endif %}
            </div>
          </li>
        </ul>
      </div>
      <form action="{% url 'home' %}" method="get" class="d-flex" role="search">
        <input class="form-control w-100 mr-2" type="search" name="q" placeholder="Search" aria-label="Search" />
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </nav>

  <div class="container">
    {% if request.user.is_authenticated %}
      <p>Hello {{ request.user }}</p>
      <!--a href="{% url 'logout' %}">Logout</a-->
    {% else %}
      <p>Hello Guest User</p>
      <!--a href="{% url 'login' %}">Login</a-->
    {% endif %}
  </div>

  <hr>
</div>
